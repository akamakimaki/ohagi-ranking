<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>おはぎランキング</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px 40px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f7f2e8;
            color: #2f2a24;
        }

        .ranking-page {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .title-area {
            display: grid;
            grid-template-columns: 110px 1fr 110px;
            align-items: end;
            gap: 10px;
            margin-bottom: 18px;
        }

        .title-character {
            display: block;
            width: 100%;
            max-height: 110px;
            object-fit: contain;
        }

        .title-character-left {
            justify-self: end;
        }

        .title-character-right {
            justify-self: start;
        }

        .title-copy {
            align-self: center;
            text-align: center;
        }

        .title-main {
            font-size: 32px;
            font-weight: 900;
            line-height: 1.15;
        }

        .title-sub {
            margin-top: 4px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            opacity: 0.55;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            border: 2px solid #2f2a24;
            border-radius: 14px;
            padding: 12px;
            background: #fff;
            color: #2f2a24;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .tab-button.active {
            background: #2f2a24;
            color: #fff;
        }

        .ranking-card {
            overflow: hidden;
            border: 2px solid #2f2a24;
            border-radius: 18px;
            background: #fff;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: 64px 1fr 110px;
            align-items: center;
            min-height: 58px;
            padding: 10px 14px;
            border-bottom: 1px solid #ddd5c8;
        }

        .ranking-row:last-child {
            border-bottom: 0;
        }

        .rank {
            font-weight: 800;
        }

        .name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score {
            text-align: right;
            font-weight: 800;
        }

        .empty,
        .loading,
        .error {
            padding: 32px 16px;
            text-align: center;
        }

        @media (max-width: 520px) {
            .title-area {
                grid-template-columns: 74px 1fr 74px;
                gap: 4px;
            }

            .title-character {
                max-height: 82px;
            }

            .title-main {
                font-size: 24px;
            }

            .title-sub {
                font-size: 9px;
            }

            .ranking-row {
                grid-template-columns: 48px 1fr 88px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="ranking-page">

        <div class="title-area">

            <img class="title-character title-character-left" src="images/giyu-normal.png" alt="">

            <div class="title-copy">
                <div class="title-main">
                    おはぎランキング
                </div>

                <div class="title-sub">
                    OHAGI RANKING
                </div>
            </div>

            <img class="title-character title-character-right" src="images/sanemi-normal.png" alt="">

        </div>

        <div class="tabs">

            <button id="escapeTab" class="tab-button" type="button">
                おはぎから逃げろ！
            </button>

            <button id="dropTab" class="tab-button" type="button">
                おはぎDROP
            </button>

        </div>

        <section id="ranking" class="ranking-card">
            <div class="loading">
                読み込み中...
            </div>
        </section>

    </main>

    <script>
        const rankingElement =
            document.getElementById("ranking");

        const escapeTab =
            document.getElementById("escapeTab");

        const dropTab =
            document.getElementById("dropTab");

        let currentGame = "escape";

        function formatScore(game, score) {

            if (game === "escape") {
                return `${score}個`;
            }

            return `${score.toLocaleString()}点`;
        }

        function setActiveTab(game) {

            escapeTab.classList.toggle(
                "active",
                game === "escape"
            );

            dropTab.classList.toggle(
                "active",
                game === "drop"
            );
        }

        async function loadRanking(game) {

            currentGame = game;

            setActiveTab(game);

            rankingElement.innerHTML =
                `<div class="loading">読み込み中...</div>`;

            try {

                const response =
                    await fetch(
                        `/api/ranking?game=${game}`
                    );

                if (!response.ok) {
                    throw new Error(
                        "ranking request failed"
                    );
                }

                const data =
                    await response.json();

                const ranking =
                    data.ranking;

                if (ranking.length === 0) {

                    rankingElement.innerHTML =
                        `<div class="empty">
                            まだ記録がありません
                        </div>`;

                    return;
                }

                rankingElement.innerHTML =
                    ranking
                        .map(
                            (entry, index) => `
                                <div class="ranking-row">
                                    <div class="rank">
                                        ${index + 1}位
                                    </div>

                                    <div class="name">
                                        ${escapeHtml(entry.name)}
                                    </div>

                                    <div class="score">
                                        ${formatScore(
                                game,
                                entry.score
                            )}
                                    </div>
                                </div>
                            `
                        )
                        .join("");

            } catch (error) {

                console.error(error);

                rankingElement.innerHTML =
                    `<div class="error">
                        ランキングを読み込めませんでした
                    </div>`;
            }
        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        escapeTab.addEventListener(
            "click",
            () => {
                loadRanking("escape");
            }
        );

        dropTab.addEventListener(
            "click",
            () => {
                loadRanking("drop");
            }
        );

        loadRanking(currentGame);
    </script>

</body>

</html>
