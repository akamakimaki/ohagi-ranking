<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px 40px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f7f2e8;
            color: #2f2a24;
        }

        .ranking-page {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .title-area {
            margin-bottom: 20px;
        }

        .title-board {
            position: relative;
            display: grid;
            grid-template-columns: 145px minmax(0, 1fr) 145px;
            align-items: center;
            min-height: 140px;
            padding: 4px 0 8px;
        }

        .character-wrap {
            position: relative;
            width: 135px;
            height: 135px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 2;
        }

        .character-wrap-left {
            justify-self: start;
        }

        .character-wrap-right {
            justify-self: end;
        }

        .title-character {
            display: block;
            width: 128px;
            max-height: 132px;
            object-fit: contain;
            animation: title-bounce 0.7s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .character-wrap-right .title-character {
            animation-delay: 0.14s;
        }

        .character-deco {
            position: absolute;
            z-index: 4;
            pointer-events: none;
            font-family: "M PLUS Rounded 1c", sans-serif;
            font-weight: 900;
            line-height: 1;
        }

        /* 義勇まわり */

        .giyu-heart {
            left: -15px;
            top: 35px;
            color: #f5a9ad;
            font-size: 26px;
            transform: rotate(-12deg);
        }

        .giyu-heart-right {
            right: -6px;
            top: 26px;
            color: #f5a9ad;
            font-size: 22px;
            transform: rotate(12deg);
        }

        .giyu-spark {
            right: 2px;
            top: -8px;
            color: #f6c85f;
            font-size: 25px;
            transform: rotate(8deg);
        }

        .giyu-motion {
            left: -10px;
            bottom: 16px;
            color: #4b352c;
            font-size: 24px;
            transform: rotate(70deg);
        }

        /* 実弥まわり */

        .sanemi-bang-top {
            right: -2px;
            top: 1px;
            color: #f6c85f;
            font-size: 27px;
            transform: rotate(8deg);
        }

        .sanemi-bang-side {
            right: -17px;
            top: 43px;
            color: #f6c85f;
            font-size: 22px;
            transform: rotate(14deg);
        }

        .sanemi-motion {
            right: -9px;
            bottom: 16px;
            color: #4b352c;
            font-size: 24px;
            transform: rotate(-70deg);
        }

        .title-copy {
            position: relative;
            z-index: 1;
            width: fit-content;
            margin: 0 auto;
            text-align: center;
        }

        .title-deco {
            position: absolute;
            z-index: 4;
            pointer-events: none;
            font-family: "M PLUS Rounded 1c", sans-serif;
            font-weight: 900;
            line-height: 1;
        }


        .title-spark-left {
            left: -10px;
            top: -24px;
            color: #f6c85f;
            font-size: 24px;
            transform: rotate(10deg);
        }

        .title-spark-right {
            right: -18px;
            top: -24px;
            color: #f6c85f;
            font-size: 24px;
            transform: rotate(-8deg);
        }

        .title-spark-right-2 {
            right: -36px;
            top: -4px;
            color: #f6c85f;
            font-size: 20px;
            transform: rotate(12deg);
        }

        .title-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            font-family: "M PLUS Rounded 1c", sans-serif;
            font-size: 44px;
            font-weight: 900;
            line-height: 1;
            white-space: nowrap;
            filter: drop-shadow(0 3px 0 #ead1c2);
        }

        .title-char {
            display: inline-block;
            -webkit-text-stroke: 6px #4b352c;
            paint-order: stroke fill;
            text-shadow:
                0 3px 0 #ffffff,
                0 7px 0 #4b352c,
                0 10px 0 #e4c5b5;
            transform-origin: center bottom;
        }

        .char-1 {
            color: #f5a9ad;
            transform: rotate(-7deg) translateY(4px);
        }

        .char-2 {
            color: #fff7e9;
            transform: rotate(3deg) translateY(-1px);
        }

        .char-3 {
            color: #f6c85f;
            transform: rotate(-5deg) translateY(-6px);
        }

        .char-4 {
            color: #fff7e9;
            transform: rotate(4deg) translateY(1px);
        }

        .char-5 {
            color: #f3a5ad;
            transform: rotate(-4deg) translateY(-3px);
        }

        .char-6 {
            color: #f7c85c;
            transform: rotate(4deg) translateY(-6px);
        }

        .char-7 {
            color: #fff7e9;
            transform: rotate(-3deg) translateY(1px);
        }

        .char-8 {
            color: #f3a5ad;
            transform: rotate(5deg) translateY(-2px);
        }

        .char-9 {
            color: #fff7e9;
            transform: rotate(8deg) translateY(3px);
        }

        .title-sub {
            position: relative;
            width: 100%;
            margin-top: 42px;
            text-align: center;
            font-family: "M PLUS Rounded 1c", sans-serif;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 0.28em;
            color: #4b352c;
        }

        .title-sub::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -30px;
            width: 20px;
            height: 13px;
            border: 3px solid #4b352c;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 40%, #8c5c50 0 2px, transparent 3px),
                radial-gradient(circle at 65% 55%, #8c5c50 0 2px, transparent 3px),
                #66443a;
            transform: translateX(-50%);
        }

        .ohagi-rays {
            position: absolute;
            top: -34px;
            width: 26px;
            height: 24px;
        }

        .ohagi-rays-left {
            left: calc(50% - 58px);
        }

        .ohagi-rays-right {
            right: calc(50% - 58px);
        }

        .ohagi-rays i {
            position: absolute;
            display: block;
            width: 5px;
            height: 15px;
            border-radius: 999px;
            background: #f58f9f;
        }

        .ohagi-rays-left i:nth-child(1) {
            left: 0;
            top: 8px;
            transform: rotate(-60deg);
        }

        .ohagi-rays-left i:nth-child(2) {
            left: 9px;
            top: 2px;
            transform: rotate(-25deg);
        }

        .ohagi-rays-left i:nth-child(3) {
            left: 18px;
            top: 7px;
            transform: rotate(5deg);
        }

        .ohagi-rays-right i:nth-child(1) {
            right: 0;
            top: 8px;
            transform: rotate(60deg);
        }

        .ohagi-rays-right i:nth-child(2) {
            right: 9px;
            top: 2px;
            transform: rotate(25deg);
        }

        .ohagi-rays-right i:nth-child(3) {
            right: 18px;
            top: 7px;
            transform: rotate(-5deg);
        }


        @keyframes title-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            45% {
                transform: translateY(-8px);
            }

            60% {
                transform: translateY(-3px);
            }
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            border: 2px solid #2f2a24;
            border-radius: 14px;
            padding: 12px;
            background: #fff;
            color: #2f2a24;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        #escapeTab::before {
            content: "🏃";
            display: inline-block;
            margin-right: 10px;
            font-size: 20px;
            vertical-align: -2px;
        }

        #escapeTab::after {
            content: " ✦";
            margin-left: 8px;
            color: #f6c85f;
            font-size: 20px;
        }

        #dropTab::before {
            content: "🍙";
            display: inline-block;
            margin-right: 10px;
            font-size: 20px;
            vertical-align: -2px;
        }

        #dropTab::after {
            content: "  ‹";
            margin-left: 8px;
            color: #f5a9ad;
            font-size: 22px;
            font-weight: 900;
        }

        .tab-button.active {
            background: #2f2a24;
            color: #fff;
        }

        .ranking-card {
            overflow: hidden;
            border: 2px solid #2f2a24;
            border-radius: 18px;
            background: #fff;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: 64px 1fr 110px 44px;
            align-items: center;
            min-height: 58px;
            padding: 10px 14px;
            border-bottom: 1px solid #ddd5c8;
        }

        .share-cell {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .share-score-btn {
            width: 34px;
            height: 34px;
            padding: 0;
            margin: 0;

            border: 0;
            border-radius: 999px;

            background: #1688f8;
            color: #fff;

            font-size: 17px;
            line-height: 1;

            cursor: pointer;
        }

        .share-score-btn:hover {
            filter: brightness(1.08);
        }

        .ranking-row:last-child {
            border-bottom: 0;
        }

        .rank {
            font-weight: 800;
        }

        .name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score {
            text-align: right;
            font-weight: 800;
        }

        .empty,
        .loading,
        .error {
            padding: 32px 16px;
            text-align: center;
        }

        @media (max-width: 520px) {
            .title-board {
                grid-template-columns: 72px minmax(0, 1fr) 72px;
                min-height: 112px;
                padding: 8px 0 10px;
            }

            .title-character {
                width: 74px;
                max-height: 88px;
            }

            .character-wrap {
                width: 76px;
                height: 92px;
            }

            .title-copy {
                width: 100%;
                min-width: 0;
            }

            .title-main {
                font-size: clamp(22px, 6.2vw, 25px);
            }

            .title-sub {
                margin-top: 34px;
                font-size: 8px;
                letter-spacing: 0.22em;
            }

            .ranking-row {
                grid-template-columns: 48px 1fr 72px 40px;
                padding: 10px;
            }
        }

        .my-score-nav {
            display: flex;
            justify-content: flex-end;
            margin: 0 0 12px;
        }

        #myScoreBtn {
            border: 0;
            background: transparent;
            color: #555;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            padding: 6px 4px;
        }

        #myScoreBtn:hover {
            text-decoration: underline;
        }

        .login-box {
            padding: 32px 20px;
            text-align: center;
        }

        .login-box p {
            margin: 0 0 16px;
            font-weight: 800;
        }

        .login-form {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .login-form input {
            width: min(100%, 320px);
            padding: 10px 12px;
            border: 2px solid #2f2a24;
            border-radius: 10px;
            font: inherit;
        }

        .login-form button {
            padding: 10px 16px;
            border: 0;
            border-radius: 10px;
            background: #1185fe;
            color: #fff;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <main class="ranking-page">

        <div class="title-area">

            <div class="title-board">

                <div class="character-wrap character-wrap-left">

                    <img class="title-character" src="images/giyu-normal.png" alt="">

                    <span class="character-deco giyu-heart" aria-hidden="true">
                        ♥
                    </span>

                    <span class="character-deco giyu-heart-right" aria-hidden="true">
                        ♥
                    </span>

                    <span class="character-deco giyu-spark" aria-hidden="true">
                        ✦
                    </span>

                    <span class="character-deco giyu-motion" aria-hidden="true">
                        〰
                    </span>

                </div>

                <div class="title-copy">

                    <span class="title-deco title-spark-left" aria-hidden="true">
                        ✦
                    </span>

                    <span class="title-deco title-spark-right" aria-hidden="true">
                        ✦
                    </span>

                    <span class="title-deco title-spark-right-2" aria-hidden="true">✦</span>

                    <div class="title-main">
                        <span class="title-char char-1">お</span>
                        <span class="title-char char-2">は</span>
                        <span class="title-char char-3">ぎ</span>
                        <span class="title-char char-4">ラ</span>
                        <span class="title-char char-5">ン</span>
                        <span class="title-char char-6">キ</span>
                        <span class="title-char char-7">ン</span>
                        <span class="title-char char-8">グ</span>
                        <span class="title-char char-9">！</span>
                    </div>

                    <div class="title-sub">

                        <span class="ohagi-rays ohagi-rays-left" aria-hidden="true">
                            <i></i>
                            <i></i>
                            <i></i>
                        </span>

                        OHAGI RANKING

                        <span class="ohagi-rays ohagi-rays-right" aria-hidden="true">
                            <i></i>
                            <i></i>
                            <i></i>
                        </span>

                    </div>

                </div>

                <div class="character-wrap character-wrap-right">

                    <img class="title-character" src="images/sanemi-normal.png" alt="">

                    <span class="character-deco sanemi-bang-top" aria-hidden="true">
                        !!
                    </span>

                    <span class="character-deco sanemi-bang-side" aria-hidden="true">
                        !!
                    </span>

                    <span class="character-deco sanemi-motion" aria-hidden="true">
                        〰
                    </span>

                </div>

            </div>

        </div>

        <div class="tabs">

            <button id="escapeTab" class="tab-button" type="button">
                おはぎから逃げろ！
            </button>

            <button id="dropTab" class="tab-button" type="button">
                おはぎDROP
            </button>

        </div>


        <div class="my-score-nav">
            <button id="myScoreBtn" type="button">
                👤 自分の記録
            </button>
        </div>


        <section id="ranking" class="ranking-card">
            <div class="loading">
                読み込み中...
            </div>
        </section>

        <div id="gameLinks">
            <button id="backToEscapeBtn" type="button">
                おはぎから逃げろ！
            </button>

            <button id="backToDropBtn" type="button">
                おはぎDROP
            </button>
        </div>

    </main>

    <script>
        const rankingElement =
            document.getElementById("ranking");

        const escapeTab =
            document.getElementById("escapeTab");

        const dropTab =
            document.getElementById("dropTab");

        const backToEscapeBtn =
            document.getElementById("backToEscapeBtn");

        const backToDropBtn =
            document.getElementById("backToDropBtn");

        const myScoreBtn =
            document.getElementById("myScoreBtn");

        const params =
            new URLSearchParams(
                window.location.search
            );

        const mineView =
            params.get("view") === "mine";

        let currentGame =
            params.get("game") === "drop"
                ? "drop"
                : "escape";

        function formatScore(game, score) {

            if (game === "escape") {
                return `${score}個`;
            }

            return `${score.toLocaleString()}点`;
        }



        function shareScore(game, score) {

            let sharePageUrl;
            let text;

            if (game === "escape") {

                sharePageUrl =
                    "https" +
                    `://ohagi-escape.makimaki-feed.net/share?score=${score}`;

                text =
                    `🌊の🟤攻撃から${score}個かわした！\n` +
                    `でも最後は食わされたァ！！\n\n` +
                    `${sharePageUrl}\n\n` +
                    `#おはぎから逃げろ`;

            } else {

                sharePageUrl =
                    "https" +
                    `://ohagi-drop.makimaki-feed.net/share?score=${score}`;

                text = [
                    `おはぎDROPで ${Number(score).toLocaleString()}点！`,
                    `腹いっぱいだァ…`,
                    "",
                    sharePageUrl,
                    "",
                    "#おはぎDROP"
                ].join("\n");
            }

            const url =
                "https" +
                "://bsky.app/intent/compose?text=" +
                encodeURIComponent(text);

            window.open(
                url,
                "_blank",
                "noopener,noreferrer"
            );
        }




        function setActiveTab(game) {

            escapeTab.classList.toggle(
                "active",
                game === "escape"
            );

            dropTab.classList.toggle(
                "active",
                game === "drop"
            );
        }

        async function loadRanking(game) {

            currentGame = game;

            setActiveTab(game);

            rankingElement.innerHTML =
                `<div class="loading">読み込み中...</div>`;

            try {

                const response =
                    await fetch(
                        mineView
                            ? `/api/my-scores?game=${game}`
                            : `/api/ranking?game=${game}`,
                        {
                            credentials: "include"
                        }
                    );

                if (
                    mineView &&
                    response.status === 401
                ) {

                    rankingElement.innerHTML = `
        <div class="login-box">

            <p>
                🦋 自分の記録を見るには<br>
                Blueskyでログインしてください
            </p>

            <form
                id="rankingLoginForm"
                class="login-form"
            >
                <input
                    id="rankingHandle"
                    type="text"
                    placeholder="example.bsky.social"
                    autocomplete="username"
                    required
                >

                <button type="submit">
                    Blueskyでログイン
                </button>
            </form>

        </div>
    `;

                    const loginForm =
                        document.getElementById(
                            "rankingLoginForm"
                        );

                    loginForm.addEventListener(
                        "submit",
                        event => {

                            event.preventDefault();

                            const handle =
                                document
                                    .getElementById(
                                        "rankingHandle"
                                    )
                                    .value
                                    .trim()
                                    .replace(/^[@＠]+/, "");

                            if (!handle) {
                                return;
                            }

                            window.location.href =
                                `/login?handle=${encodeURIComponent(handle)}` +
                                `&game=${encodeURIComponent(game)}`;
                        }
                    );

                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        "ranking request failed"
                    );
                }

                const data =
                    await response.json();

                const ranking =
                    mineView
                        ? data.scores
                            .slice()
                            .sort(
                                (a, b) =>
                                    b.score - a.score
                            )
                            .map(entry => ({
                                ...entry,
                                name: "自分"
                            }))
                        : data.ranking;

                if (ranking.length === 0) {

                    rankingElement.innerHTML =
                        `<div class="empty">
                            まだ記録がありません
                        </div>`;

                    return;
                }

                rankingElement.innerHTML =
                    ranking
                        .map(
                            (entry, index) => `
                                <div class="ranking-row">
                                    <div class="rank">
                                        ${index < 3
                                    ? ["🥇", "🥈", "🥉"][index]
                                    : (index + 1) + "位"}
                                    </div>

                                    <div class="name">
                                        ${escapeHtml(entry.name)}
                                    </div>

                                    <div class="score">
                                        ${formatScore(
                                        game,
                                        entry.score
                                    )}
                                    </div>
                                    <div class="share-cell">
    <button
        class="share-score-btn"
        type="button"
        data-game="${game}"
        data-score="${entry.score}"
        aria-label="この記録をBlueskyで共有"
        title="Blueskyで共有"
    >
        🦋
    </button>
</div>
                                </div>
                            `
                        )
                        .join("");

            } catch (error) {

                console.error(error);

                rankingElement.innerHTML =
                    `<div class="error">
                        ランキングを読み込めませんでした
                    </div>`;
            }
        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        rankingElement.addEventListener(
            "click",
            event => {

                const button =
                    event.target.closest(
                        ".share-score-btn"
                    );

                if (!button) {
                    return;
                }

                const game =
                    button.dataset.game;

                const score =
                    Number(
                        button.dataset.score
                    );

                shareScore(
                    game,
                    score
                );
            }
        );


        myScoreBtn.addEventListener(
            "click",
            () => {

                window.location.href =
                    `/?game=${encodeURIComponent(currentGame)}&view=mine`;
            }
        );



        escapeTab.addEventListener(
            "click",
            () => {
                loadRanking("escape");
            }
        );

        dropTab.addEventListener(
            "click",
            () => {
                loadRanking("drop");
            }
        );

        backToEscapeBtn.addEventListener(
            "click",
            () => {
                window.location.href =
                    "https://akamakimaki.github.io/ohagi-escape/";
            }
        );

        backToDropBtn.addEventListener(
            "click",
            () => {
                window.location.href =
                    "https://akamakimaki.github.io/ohagi-drop/";
            }
        );

        loadRanking(currentGame);
    </script>

</body>

</html>
