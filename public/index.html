<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>おはぎランキング</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 16px 40px;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f7f2e8;
            color: #2f2a24;
        }

        .ranking-page {
            width: min(100%, 720px);
            margin: 0 auto;
        }

        .title-area {
            margin-bottom: 20px;
        }

        .title-board {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-height: 130px;
            padding: 10px 118px 8px;
        }

        .title-character {
            position: absolute;
            bottom: -2px;
            width: 128px;
            max-height: 138px;
            object-fit: contain;
            z-index: 2;
            animation: title-bounce 0.7s ease-in-out infinite;
            transform-origin: center bottom;
        }

        .title-character-left {
            left: 18px;
        }

        .title-character-right {
            right: 18px;
            animation-delay: 0.14s;
        }

        .title-copy {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #2f2a24;
        }

        .title-main {
            font-size: 36px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 0.04em;
            color: #fffaf2;
            -webkit-text-stroke: 5px #3b2f26;
            paint-order: stroke fill;
            text-shadow:
                0 4px 0 #241c17;
        }

        .title-sub {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.22em;
            color: #3b2f26;
        }


        @keyframes title-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            45% {
                transform: translateY(-8px);
            }

            60% {
                transform: translateY(-3px);
            }
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-button {
            border: 2px solid #2f2a24;
            border-radius: 14px;
            padding: 12px;
            background: #fff;
            color: #2f2a24;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .tab-button.active {
            background: #2f2a24;
            color: #fff;
        }

        .ranking-card {
            overflow: hidden;
            border: 2px solid #2f2a24;
            border-radius: 18px;
            background: #fff;
        }

        .ranking-row {
            display: grid;
            grid-template-columns: 64px 1fr 110px;
            align-items: center;
            min-height: 58px;
            padding: 10px 14px;
            border-bottom: 1px solid #ddd5c8;
        }

        .ranking-row:last-child {
            border-bottom: 0;
        }

        .rank {
            font-weight: 800;
        }

        .name {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .score {
            text-align: right;
            font-weight: 800;
        }

        .empty,
        .loading,
        .error {
            padding: 32px 16px;
            text-align: center;
        }

        @media (max-width: 520px) {
            .title-board {
                min-height: 118px;
                padding: 14px 78px 16px;
                border-radius: 22px;
            }

            .title-character {
                width: 90px;
                max-height: 102px;
            }

            .title-character-left {
                left: 8px;
            }

            .title-character-right {
                right: 8px;
            }

            .title-main {
                font-size: 23px;
            }

            .title-sub {
                font-size: 10px;
            }


            .ranking-row {
                grid-template-columns: 48px 1fr 88px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <main class="ranking-page">

        <div class="title-area">

            <div class="title-board">

                <img class="title-character title-character-left" src="images/giyu-normal.png" alt="">

                <div class="title-copy">
                    <div class="title-main">
                        おはぎランキング
                    </div>

                    <div class="title-sub">
                        OHAGI RANKING
                    </div>
                </div>

                <img class="title-character title-character-right" src="images/sanemi-normal.png" alt="">

            </div>

        </div>


        <div class="tabs">

            <button id="escapeTab" class="tab-button" type="button">
                おはぎから逃げろ！
            </button>

            <button id="dropTab" class="tab-button" type="button">
                おはぎDROP
            </button>

        </div>

        <section id="ranking" class="ranking-card">
            <div class="loading">
                読み込み中...
            </div>
        </section>

    </main>

    <script>
        const rankingElement =
            document.getElementById("ranking");

        const escapeTab =
            document.getElementById("escapeTab");

        const dropTab =
            document.getElementById("dropTab");

        let currentGame = "escape";

        function formatScore(game, score) {

            if (game === "escape") {
                return `${score}個`;
            }

            return `${score.toLocaleString()}点`;
        }

        function setActiveTab(game) {

            escapeTab.classList.toggle(
                "active",
                game === "escape"
            );

            dropTab.classList.toggle(
                "active",
                game === "drop"
            );
        }

        async function loadRanking(game) {

            currentGame = game;

            setActiveTab(game);

            rankingElement.innerHTML =
                `<div class="loading">読み込み中...</div>`;

            try {

                const response =
                    await fetch(
                        `/api/ranking?game=${game}`
                    );

                if (!response.ok) {
                    throw new Error(
                        "ranking request failed"
                    );
                }

                const data =
                    await response.json();

                const ranking =
                    data.ranking;

                if (ranking.length === 0) {

                    rankingElement.innerHTML =
                        `<div class="empty">
                            まだ記録がありません
                        </div>`;

                    return;
                }

                rankingElement.innerHTML =
                    ranking
                        .map(
                            (entry, index) => `
                                <div class="ranking-row">
                                    <div class="rank">
                                        ${index < 3
                                    ? ["🥇", "🥈", "🥉"][index]
                                    : (index + 1) + "位"}
                                    </div>

                                    <div class="name">
                                        ${escapeHtml(entry.name)}
                                    </div>

                                    <div class="score">
                                        ${formatScore(
                                        game,
                                        entry.score
                                    )}
                                    </div>
                                </div>
                            `
                        )
                        .join("");

            } catch (error) {

                console.error(error);

                rankingElement.innerHTML =
                    `<div class="error">
                        ランキングを読み込めませんでした
                    </div>`;
            }
        }

        function escapeHtml(value) {

            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        escapeTab.addEventListener(
            "click",
            () => {
                loadRanking("escape");
            }
        );

        dropTab.addEventListener(
            "click",
            () => {
                loadRanking("drop");
            }
        );

        loadRanking(currentGame);
    </script>

</body>

</html>
